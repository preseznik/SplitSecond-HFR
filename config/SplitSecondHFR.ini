; Split/Second HFR - configuration. Keep this file next to DXFreezerServer.dll in the game folder.
; A log of each session is written to <game folder>\hfr_logs\<date-time>\hfr.log

[General]
; 1 = mod active. 0 = the DLL loads but changes nothing (the game behaves exactly like the original).
Enabled=1

[Timing]
; 60 = native 60 Hz: the game simulates one 1/60 s step per frame (physics already run at 60 Hz internally).
; 30 = original behaviour (two 1/60 s steps per 1/30 s frame).
Mode=60
; 1 = exact frame pacing (replaces the game's coarse millisecond sleep with a precise wait).
PreciseLimiter=1

[Fixes]
; 1 = AI drivers make decisions at their original 30 Hz rate while the game runs at 60, so they steer exactly as in
; the original game. 0 = AI updates every frame (reacts twice as fast at 60 FPS).
AI30Hz=1

[Hotkeys]
; Virtual-key code of the key that switches between 30 and 60 while playing (0x77 = F8, 0 = disabled).
ToggleFps=0x77

[Logging]
; 1 = also write a per-frame timing file (frames.csv) to the session log folder.
FrameLog=0
